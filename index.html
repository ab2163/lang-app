<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Words</title>
<style>
  :root { --ink:#1c2430; --muted:#5c6b7a; --line:#e6ebf0; --bg:#f4f7fb; --card:#fff; --es:#b85c38; --pt:#2e7d4f; --de:#1f4e79; --hi:#5c4b8a; --soft:#eef3f8; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--ink); padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:5; background:rgba(244,247,251,.94); backdrop-filter:blur(10px); padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  body.header-off header { display:none; }
  #showHeader { display:none; position:fixed; top:10px; right:12px; z-index:6; border:1px solid var(--line); background:rgba(255,255,255,.96); color:var(--ink); border-radius:999px; padding:8px 12px; font-size:14px; font-weight:700; box-shadow:0 4px 14px rgba(28,36,48,.12); }
  body.header-off #showHeader { display:block; }
  h1 { font-size:22px; line-height:1.1; margin:0 0 4px; letter-spacing:-.03em; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 12px; }
  input[type=search] { width:100%; border:1px solid var(--line); background:white; border-radius:12px; font-size:16px; padding:12px 14px; color:var(--ink); outline:none; }
  input[type=search]:focus { border-color:var(--de); }
  .row { display:flex; gap:8px; margin-top:10px; overflow-x:auto; }
  .row::-webkit-scrollbar { display:none; }
  button.chip, button.toggle { border:1px solid var(--line); background:white; color:var(--ink); border-radius:999px; padding:8px 12px; font-size:14px; white-space:nowrap; }
  button.chip.on { color:white; border-color:transparent; }
  button.chip.on.es { background:var(--es); } button.chip.on.pt { background:var(--pt); }
  button.chip.on.de { background:var(--de); } button.chip.on.hi { background:var(--hi); }
  button.chip.on.all { background:#243246; } button.toggle.on { background:#243246; color:white; border-color:#243246; }
  main { padding:12px 16px 28px; }
  .count { color:var(--muted); font-size:13px; margin:4px 2px 10px; }
  article { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px; margin:0 0 10px; }
  .en { font-size:20px; font-weight:700; letter-spacing:-.02em; }
  .tag { display:inline-block; margin-left:8px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); vertical-align:3px; }
  .lang { margin-top:10px; }
  .label { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px; }
  .label.es { color:var(--es); } .label.pt { color:var(--pt); } .label.de { color:var(--de); } .label.hi { color:var(--hi); }
  .word { font-size:18px; line-height:1.35; }
  .forms { display:grid; gap:6px; margin-top:8px; }
  .form { background:var(--soft); border-radius:10px; padding:8px 10px; }
  .form b { display:block; font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.04em; text-transform:uppercase; margin-bottom:2px; }
  .form span { font-size:15px; line-height:1.35; }
  .hidden-answer .word, .hidden-answer .forms, .hidden-answer .note-box { filter:blur(7px); user-select:none; pointer-events:none; }
  article.revealed .word, article.revealed .forms, article.revealed .note-box { filter:none; pointer-events:auto; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  .num { display:inline-flex; align-items:center; justify-content:center; min-width:28px; height:22px; margin-right:8px; padding:0 7px; border-radius:999px; background:#243246; color:white; font-size:12px; font-weight:700; letter-spacing:0; vertical-align:3px; }
  .range { display:none; align-items:center; gap:8px; margin-top:10px; }
  .range.on { display:flex; }
  .range label { color:var(--muted); font-size:13px; font-weight:600; }
  .range input { width:88px; border:1px solid var(--line); background:white; border-radius:10px; font-size:16px; padding:8px 10px; color:var(--ink); outline:none; }
  .range input:focus { border-color:var(--de); }
  button.hide-word { border:1px solid var(--line); background:white; color:var(--muted); border-radius:999px; padding:6px 10px; font-size:12px; font-weight:700; margin-top:10px; }
  article.compressed { padding:8px 12px; cursor:pointer; }
  article.compressed .en { font-size:15px; font-weight:600; color:var(--muted); }
  article.compressed .num { background:#b7c2cc; }
  article.compressed .lang, article.compressed .hint, article.compressed .hide-word, article.compressed .tag { display:none; }
  .note-box { margin-top:8px; }
  .note-tools { display:flex; gap:6px; margin-bottom:6px; }
  .note-tools button { width:28px; height:26px; border:1px solid var(--line); background:white; border-radius:8px; font-size:13px; color:var(--ink); }
  .note-tools button b { font-style:normal; } .note-tools button i { font-weight:700; }
  .note { width:100%; border:1px dashed var(--line); background:#fbfcfe; border-radius:10px; font:inherit; font-size:14px; line-height:1.4; color:var(--ink); padding:8px 10px; resize:vertical; min-height:38px; }
  .note:focus { outline:none; border-color:var(--de); background:white; }
  .note::placeholder { color:#9aa6b2; }
  .note-view { margin-top:6px; font-size:14px; line-height:1.45; color:var(--ink); }
  .note-view:empty { display:none; }
  .note-view b { font-weight:700; } .note-view i { font-style:italic; }
  body.notes-off .note-box { display:none; }
  .file-btn { display:none; }
  .tools { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .tools button { border:1px solid var(--line); background:white; color:var(--ink); border-radius:999px; padding:8px 12px; font-size:14px; }
  .github { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  .github input { flex:1; min-width:220px; border:1px solid var(--line); background:white; border-radius:10px; font-size:15px; padding:8px 10px; color:var(--ink); outline:none; }
  .github button { border:1px solid var(--line); background:white; color:var(--ink); border-radius:999px; padding:8px 12px; font-size:14px; }
  #ghStatus { flex-basis:100%; }
  @media (min-width:720px) { .forms { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Words</h1>
  <p class="sub">Hide words you know. A hidden card collapses; tap it to bring it back.</p>
  <input id="q" type="search" placeholder="Search English or a translation" autocomplete="off" enterkeyhint="search">
  <div class="row" id="langs">
    <button class="chip on es" data-lang="es">Spanish</button>
    <button class="chip pt" data-lang="pt">Portuguese</button>
    <button class="chip de" data-lang="de">German</button>
    <button class="chip hi" data-lang="hi">Hindi</button>
    <button class="chip all" data-lang="all">All</button>
  </div>
  <div class="row">
    <button class="toggle" id="verbs">Verbs only</button>
    <button class="toggle" id="hide">Hide answers</button>
    <button class="toggle" id="rangeBtn">Range</button>
    <button class="toggle" id="unhideRange">Unhide range</button>
    <button class="toggle" id="notesBtn">Hide notes</button>
    <button class="toggle" id="headerBtn">Hide header</button>
  </div>
  <div class="tools">
    <button id="exportNotes" type="button">Export notes</button>
    <button id="importNotes" type="button">Import notes</button>
    <button id="loadGithub" type="button">Load notes from GitHub</button>
    <button id="saveGithub" type="button">Save notes to GitHub</button>
    <input id="importFile" class="file-btn" type="file" accept="application/json,.json">
  </div>
  <div class="github" id="github">
    <p class="sub">The token stays in this browser only. It is never written into the page or the repo.</p>
    <input id="ghToken" type="password" placeholder="Fine-grained token, contents:write on lang-app" autocomplete="off">
    <button id="saveToken" type="button">Remember token</button>
    <span id="ghStatus" class="sub"></span>
  </div>
  <div class="range" id="range">
    <label for="fromN">From</label>
    <input id="fromN" type="number" min="1" max="1000" value="1" inputmode="numeric">
    <label for="toN">to</label>
    <input id="toN" type="number" min="1" max="1000" value="1000" inputmode="numeric">
  </div>
</header>
<button id="showHeader" type="button">Show controls</button>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

const list = document.getElementById("list");
const count = document.getElementById("count");
const q = document.getElementById("q");
let lang = "es", verbsOnly = false, hide = false, useRange = false;
const labels = {es:"Spanish", pt:"Portuguese", de:"German", hi:"Hindi"};
WORDS.forEach((w, i) => w.n = i + 1);
const fromN = document.getElementById("fromN");
const toN = document.getElementById("toN");
const STORE = "words-hidden-v1";
const NOTES = "words-notes-v1";
const NOTES_SHOW = "words-notes-show-v1";
const hidden = new Set(JSON.parse(localStorage.getItem(STORE) || "[]"));
let notes = JSON.parse(localStorage.getItem(NOTES) || "{}");
let showNotes = localStorage.getItem(NOTES_SHOW) !== "0";
function saveHidden() { localStorage.setItem(STORE, JSON.stringify([...hidden])); }
function saveNotes() { localStorage.setItem(NOTES, JSON.stringify(notes)); }
function noteText(n, code) { return (notes[n] && notes[n][code]) || ""; }
function setNote(n, code, value) {
  const key = String(n);
  if (!notes[key]) notes[key] = {};
  const v = value.trim();
  if (v) notes[key][code] = value;
  else delete notes[key][code];
  if (!Object.keys(notes[key]).length) delete notes[key];
  saveNotes();
}
function applyNotesVisibility() {
  document.body.classList.toggle("notes-off", !showNotes);
  const btn = document.getElementById("notesBtn");
  btn.textContent = showNotes ? "Hide notes" : "Show notes";
  btn.classList.toggle("on", !showNotes);
}
function forms(w, code) {
  const doing = w[code + "_do"], you = w[code + "_you"];
  if (!doing && !you) return "";
  return `<div class="forms">${doing ? `<div class="form"><b>I'm doing</b><span>${doing}</span></div>` : ""}${you ? `<div class="form"><b>You</b><span>${you}</span></div>` : ""}</div>`;
}
function esc(s) { return s.replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">"); }
function renderNote(raw) {
  return esc(raw).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>").replace(/\n/g, "<br>");
}
function block(w, code) {
  const raw = noteText(w.n, code);
  const note = esc(raw);
  return `<div class="lang"><div class="label ${code}">${labels[code]}</div><div class="word">${w[code] || "—"}</div>${forms(w, code)}<div class="note-box"><div class="note-tools"><button type="button" class="fmt" data-wrap="**" title="Bold"><b>B</b></button><button type="button" class="fmt" data-wrap="*" title="Italic"><i>I</i></button></div><textarea class="note" data-n="${w.n}" data-lang="${code}" rows="2" placeholder="${labels[code]} note. **bold** *italic*">${note}</textarea><div class="note-view">${renderNote(raw)}</div></div></div>`;
}
function bounds() {
  let a = parseInt(fromN.value, 10);
  let b = parseInt(toN.value, 10);
  if (!Number.isFinite(a)) a = 1;
  if (!Number.isFinite(b)) b = WORDS.length;
  a = Math.min(Math.max(a, 1), WORDS.length);
  b = Math.min(Math.max(b, 1), WORDS.length);
  if (a > b) [a, b] = [b, a];
  return [a, b];
}
function render() {
  const query = q.value.trim().toLowerCase();
  const [a, b] = bounds();
  const shown = WORDS.filter(w => {
    if (useRange && (w.n < a || w.n > b)) return false;
    if (verbsOnly && !w.verb) return false;
    if (!query) return true;
    if (String(w.n) === query) return true;
    const noteBits = notes[w.n] ? Object.values(notes[w.n]).join(" ") : "";
    return [w.en,w.es,w.pt,w.de,w.hi,w.es_do,w.es_you,w.pt_do,w.pt_you,w.de_do,w.de_you,w.hi_do,w.hi_you,noteBits].join(" ").toLowerCase().includes(query);
  });
  const rangeLabel = useRange ? ` · ${a}–${b}` : "";
  const hiddenHere = shown.filter(w => hidden.has(w.n)).length;
  const hiddenLabel = hiddenHere ? ` · ${hiddenHere} hidden` : "";
  count.textContent = shown.length + (shown.length === 1 ? " word" : " words") + rangeLabel + hiddenLabel;
  const codes = lang === "all" ? ["es","pt","de","hi"] : [lang];
  list.innerHTML = shown.map(w => {
    const collapsed = hidden.has(w.n);
    const answerClass = hide && !collapsed ? "hidden-answer" : "revealed";
    return `<article class="${answerClass}${collapsed ? " compressed" : ""}" data-n="${w.n}"><div class="en"><span class="num">${w.n}</span>${w.en}${w.verb ? '<span class="tag">verb</span>' : ""}</div>${codes.map(c => block(w, c)).join("")}${collapsed ? "" : `<button class="hide-word" data-n="${w.n}">Hide</button>`}${hide && !collapsed ? '<div class="hint">Tap to show</div>' : ""}</article>`;
  }).join("");
}
document.getElementById("langs").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  lang = btn.dataset.lang;
  document.querySelectorAll("#langs button").forEach(b => b.classList.remove("on"));
  btn.classList.add("on"); render();
});
document.getElementById("verbs").addEventListener("click", e => { verbsOnly = !verbsOnly; e.currentTarget.classList.toggle("on", verbsOnly); render(); });
document.getElementById("hide").addEventListener("click", e => { hide = !hide; e.currentTarget.classList.toggle("on", hide); render(); });
document.getElementById("rangeBtn").addEventListener("click", e => {
  useRange = !useRange;
  e.currentTarget.classList.toggle("on", useRange);
  document.getElementById("range").classList.toggle("on", useRange);
  render();
});
fromN.addEventListener("input", render);
toN.addEventListener("input", render);
document.getElementById("unhideRange").addEventListener("click", () => {
  const [a, b] = bounds();
  const lo = useRange ? a : 1;
  const hi = useRange ? b : WORDS.length;
  WORDS.forEach(w => { if (w.n >= lo && w.n <= hi) hidden.delete(w.n); });
  saveHidden();
  render();
});
function wrapSelection(area, mark) {
  const start = area.selectionStart, end = area.selectionEnd;
  const value = area.value;
  const selected = value.slice(start, end) || "text";
  const next = value.slice(0, start) + mark + selected + mark + value.slice(end);
  area.value = next;
  const from = start + mark.length;
  area.setSelectionRange(from, from + selected.length);
  area.dispatchEvent(new Event("input", { bubbles: true }));
  area.focus();
}
list.addEventListener("click", e => {
  const fmt = e.target.closest(".fmt");
  if (!fmt) return;
  e.preventDefault();
  e.stopPropagation();
  const area = fmt.closest(".note-box").querySelector(".note");
  wrapSelection(area, fmt.dataset.wrap);
});
list.addEventListener("input", e => {
  if (!e.target.classList.contains("note")) return;
  setNote(e.target.dataset.n, e.target.dataset.lang, e.target.value);
  e.target.parentElement.querySelector(".note-view").innerHTML = renderNote(e.target.value);
});
document.getElementById("notesBtn").addEventListener("click", () => {
  showNotes = !showNotes;
  localStorage.setItem(NOTES_SHOW, showNotes ? "1" : "0");
  applyNotesVisibility();
});
document.getElementById("exportNotes").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(notes, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "notes.json";
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("importNotes").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const data = JSON.parse(await file.text());
  notes = data && typeof data === "object" ? data : {};
  saveNotes();
  e.target.value = "";
  render();
});
const GH = { owner: "ab2163", repo: "lang-app", branch: "main", path: "notes.json" };
const TOKEN_KEY = "words-github-token-v1";
const ghToken = document.getElementById("ghToken");
const ghStatus = document.getElementById("ghStatus");
if (localStorage.getItem(TOKEN_KEY)) ghToken.value = localStorage.getItem(TOKEN_KEY);
document.getElementById("saveToken").addEventListener("click", () => {
  const token = ghToken.value.trim();
  if (!token) { localStorage.removeItem(TOKEN_KEY); ghStatus.textContent = "Token cleared."; return; }
  localStorage.setItem(TOKEN_KEY, token);
  ghStatus.textContent = "Token remembered on this browser.";
});
function toBase64(text) {
  return btoa(unescape(encodeURIComponent(text)));
}
document.getElementById("saveGithub").addEventListener("click", async () => {
  const token = ghToken.value.trim();
  if (!token) { ghStatus.textContent = "Add a token first."; return; }
  ghStatus.textContent = "Saving…";
  const headers = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}?ref=${GH.branch}`;
  try {
    const existing = await fetch(url, { headers });
    let sha = "";
    if (existing.ok) {
      const info = await existing.json();
      sha = info.sha || "";
    } else if (existing.status !== 404) {
      throw new Error("Could not read notes.json (" + existing.status + ")");
    }
    const body = { message: "Update vocabulary notes", content: toBase64(JSON.stringify(notes, null, 2) + "\n"), branch: GH.branch };
    if (sha) body.sha = sha;
    const put = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`, {
      method: "PUT", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    if (!put.ok) throw new Error((await put.text()).slice(0, 180) || ("Save failed (" + put.status + ")"));
    ghStatus.textContent = "Committed notes.json to " + GH.owner + "/" + GH.repo + ".";
  } catch (err) {
    ghStatus.textContent = err.message || "Save failed.";
  }
});
list.addEventListener("click", e => {
  if (e.target.classList.contains("note") || e.target.closest(".note-box")) return;
  const hideBtn = e.target.closest(".hide-word");
  if (hideBtn) {
    e.stopPropagation();
    hidden.add(Number(hideBtn.dataset.n));
    saveHidden();
    render();
    return;
  }
  const card = e.target.closest("article");
  if (!card) return;
  const n = Number(card.dataset.n);
  if (hidden.has(n)) {
    hidden.delete(n);
    saveHidden();
    render();
    return;
  }
  if (!hide) return;
  card.classList.toggle("revealed");
  card.classList.toggle("hidden-answer");
});
q.addEventListener("input", render);
applyNotesVisibility();
async function loadNotesFromGitHub(manual) {
  try {
    const r = await fetch("notes.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) {
      if (manual) ghStatus.textContent = "No notes.json on GitHub yet.";
      return;
    }
    const data = await r.json();
    if (!data || typeof data !== "object") return;
    notes = data;
    saveNotes();
    render();
    const n = Object.keys(notes).length;
    ghStatus.textContent = "Loaded " + n + " word" + (n === 1 ? "" : "s") + " of notes from GitHub.";
  } catch (err) {
    if (manual) ghStatus.textContent = "Could not load notes from GitHub.";
  }
}
document.getElementById("loadGithub").addEventListener("click", () => loadNotesFromGitHub(true));
const HEADER_KEY = "words-header-show-v1";
let showHeader = localStorage.getItem(HEADER_KEY) !== "0";
function applyHeader() {
  document.body.classList.toggle("header-off", !showHeader);
  const btn = document.getElementById("headerBtn");
  if (btn) btn.classList.toggle("on", !showHeader);
}
document.getElementById("headerBtn").addEventListener("click", () => {
  showHeader = false;
  localStorage.setItem(HEADER_KEY, "0");
  applyHeader();
});
document.getElementById("showHeader").addEventListener("click", () => {
  showHeader = true;
  localStorage.setItem(HEADER_KEY, "1");
  applyHeader();
});
applyHeader();
loadNotesFromGitHub(false);
render();
</script>
